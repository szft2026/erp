# Nginx 反代配置（由 nginx:alpine 的 templates 机制渲染，${DOMAIN} 来自环境变量）
#
# 证书放在宿主机 ./certs 下：
#   certs/fullchain.pem
#   certs/privkey.pem
# 用 certbot 签的话：
#   certbot certonly --webroot -w /var/www/certbot -d 你的域名
# 然后把 /etc/letsencrypt/live/你的域名/ 下的两个文件复制/软链到 ./certs

server {
    listen 80;
    server_name ${DOMAIN};

    # certbot webroot 校验用
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # 应用允许上传 64MB（php.ini 里也是 64M）
    client_max_body_size 64m;

    access_log /var/log/nginx/h5erp.access.log;
    error_log  /var/log/nginx/h5erp.error.log;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # 应用靠这个判断 https，用来生成静态资源地址
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
